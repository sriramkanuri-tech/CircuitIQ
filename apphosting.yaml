# apphosting.yaml - CircuitIQ Next.js App Hosting configuration
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://placeholder.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    value: placeholder-publishable-key
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: http://localhost:3000
    availability:
      - BUILD
      - RUNTIME
